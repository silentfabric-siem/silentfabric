# Single-VM deployment: SilentFabric plus one ClickHouse instance.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: silentfabric
      CLICKHOUSE_USER: silentfabric
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      retries: 20

  silentfabric:
    build: .
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SF_CLICKHOUSE_DSN: clickhouse://silentfabric:${CLICKHOUSE_PASSWORD:-change-me}@clickhouse:9000/silentfabric
      SF_ALERT_WEBHOOK: ${SF_ALERT_WEBHOOK:-}
    volumes:
      - ./rules:/etc/silentfabric/rules:ro
    ports:
      - "514:5514/udp"
      - "514:5514/tcp"
      - "8080:8080"

volumes:
  clickhouse-data:
